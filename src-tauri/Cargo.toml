[package]
name = "synccut"
version = "0.1.0"
description = "Local voiceover-to-footage assembly for Premiere"
authors = ["SyncCut"]
edition = "2021"

[lib]
name = "synccut_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-updater = "2.11.0"
