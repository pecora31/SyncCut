<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#101318"/><rect x="30" y="24" width="1340" height="78" rx="10" fill="#1b212b"/><text x="60" y="58" fill="#f5f7fb" font-family="Arial" font-size="23" font-weight="700">Timeline</text><text x="60" y="84" fill="#94a3b8" font-family="Arial" font-size="14">Duyệt candidate, xử lý gap và xuất XML.</text><rect x="950" y="44" width="150" height="38" rx="7" fill="#263241"/><text x="978" y="68" fill="#dbeafe" font-family="Arial" font-size="14">Rebuild timeline</text><rect x="1118" y="44" width="100" height="38" rx="7" fill="#334155"/><text x="1144" y="68" fill="white" font-family="Arial" font-size="14">Lock</text><rect x="1236" y="44" width="104" height="38" rx="7" fill="#2563eb"/><text x="1258" y="68" fill="white" font-family="Arial" font-size="14">Export</text><rect x="30" y="126" width="900" height="570" rx="10" fill="#171d27"/><rect x="960" y="126" width="410" height="570" rx="10" fill="#171d27"/><text x="60" y="168" fill="#dbeafe" font-family="Arial" font-size="18">Sequence</text><line x1="80" y1="220" x2="880" y2="220" stroke="#475569"/><g font-family="Arial" font-size="12" fill="#94a3b8"><text x="80" y="210">00:00</text><text x="280" y="210">00:10</text><text x="480" y="210">00:20</text><text x="680" y="210">00:30</text><text x="880" y="210">00:40</text></g><rect x="80" y="250" width="170" height="82" rx="7" fill="#365b8c"/><text x="98" y="286" fill="white" font-family="Arial" font-size="14">Beat 01 · intro</text><text x="98" y="310" fill="#dbeafe" font-family="Arial" font-size="12">selected clip</text><rect x="270" y="250" width="110" height="82" rx="7" fill="#6b3f55"/><text x="288" y="286" fill="white" font-family="Arial" font-size="14">GAP</text><text x="288" y="310" fill="#fecdd3" font-family="Arial" font-size="12">needs review</text><rect x="400" y="250" width="260" height="82" rx="7" fill="#365b8c"/><text x="418" y="286" fill="white" font-