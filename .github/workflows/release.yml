name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.2.0'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch yt-dlp binary for release bundling
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $release = Invoke-RestMethod 'https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest'
          $binary = $release.assets | Where-Object name -eq 'yt-dlp.exe'
          $checksums = $release.assets | Where-Object name -eq 'SHA2-256SUMS'
          if (-not $binary -or -not $checksums) { throw 'yt-dlp release assets are incomplete.' }
          Invoke-WebRequest $binary.browser_download_url -OutFile bin/yt-dlp.exe
          Invoke-WebRequest $checksums.browser_download_url -OutFile bin/SHA2-256SUMS
          $line = Get-Content bin/SHA2-256SUMS | Where-Object { $_ -match '\s+\*?yt-dlp\.exe$' }
          if (-not $line) { throw 'No checksum for yt-dlp.exe.' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash bin/yt-dlp.exe -Algorithm SHA256).Hash.ToLower() -ne $expected.ToLower()) { throw 'yt-dlp checksum mismatch.' }
          $release.tag_name | Set-Content bin/yt-dlp-release.txt

      - name: Check Rust contracts compile
        run: cargo check --tests --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.2.0' }}
          name: SyncCut ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.2.0' }}
          body: Candidate editor build. Prepare the local runtime separately and complete customer GPU/Premiere acceptance before publication. No AI model weights are bundled.
          draft: true
          prerelease: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            bin/yt-dlp-release.txt
