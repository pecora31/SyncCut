name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.2.5'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch yt-dlp binary for release bundling
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $release = Invoke-RestMethod 'https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest'
          $binary = $release.assets | Where-Object name -eq 'yt-dlp.exe'
          $checksums = $release.assets | Where-Object name -eq 'SHA2-256SUMS'
          if (-not $binary -or -not $checksums) { throw 'yt-dlp release assets are incomplete.' }
          Invoke-WebRequest $binary.browser_download_url -OutFile bin/yt-dlp.exe
          Invoke-WebRequest $checksums.browser_download_url -OutFile bin/SHA2-256SUMS
          $line = Get-Content bin/SHA2-256SUMS | Where-Object { $_ -match '\s+\*?yt-dlp\.exe$' }
          if (-not $line) { throw 'No checksum for yt-dlp.exe.' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash bin/yt-dlp.exe -Algorithm SHA256).Hash.ToLower() -ne $expected.ToLower()) { throw 'yt-dlp checksum mismatch.' }
          $release.tag_name | Set-Content bin/yt-dlp-release.txt

      - name: Fetch verified FFmpeg tools for the setup assistant
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest'
          $name = 'ffmpeg-n8.1-latest-win64-gpl-8.1.zip'
          $archive = $release.assets | Where-Object name -eq $name
          $checksums = $release.assets | Where-Object name -eq 'checksums.sha256'
          if (-not $archive -or -not $checksums) { throw 'FFmpeg release assets are incomplete.' }
          $archivePath = Join-Path $env:RUNNER_TEMP $name
          $checksumPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-checksums.sha256'
          Invoke-WebRequest $archive.browser_download_url -OutFile $archivePath
          Invoke-WebRequest $checksums.browser_download_url -OutFile $checksumPath
          $line = Get-Content $checksumPath | Where-Object { $_ -match ([regex]::Escape($name) + '$') }
          if (-not $line) { throw 'No checksum for FFmpeg archive.' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower() -ne $expected.ToLower()) { throw 'FFmpeg checksum mismatch.' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'synccut-ffmpeg'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractRoot
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) {
            $binary = Get-ChildItem -LiteralPath $extractRoot -Recurse -Filter $name -File | Select-Object -First 1
            if (-not $binary) { throw "Missing $name in FFmpeg archive." }
            Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path 'bin' $name)
          }
          $release.tag_name | Set-Content bin/ffmpeg-release.txt

      - name: Check Rust contracts compile
        run: cargo check --tests --manifest-path src-tauri/Cargo.toml

      - name: Build signed Tauri updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Create updater metadata
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ('${{ inputs.tag }}') { '${{ inputs.tag }}' } else { 'v0.2.5' }
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS updater installer was not created.' }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Updater signature was not created.' }
          $metadata = [ordered]@{
            version = $tag.TrimStart('v')
            notes = 'SyncCut update: runtime storage selection, download progress and in-app updating.'
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{ 'windows-x86_64' = @{ url = "https://github.com/pecora31/SyncCut/releases/download/$tag/$($installer.Name)"; signature = (Get-Content -Raw $signaturePath).Trim() } }
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.2.5' }}
          name: SyncCut ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.2.5' }}
          body: Candidate editor build with an in-app local AI setup assistant. FFmpeg is bundled; Python packages and selected model weights are installed explicitly from the app. Complete customer GPU/Premiere acceptance before delivery.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            latest.json
            bin/yt-dlp-release.txt
            bin/ffmpeg-release.txt
